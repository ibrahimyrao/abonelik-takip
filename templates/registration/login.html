{% load static %}
<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap — Abonelik Takip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
  <div class="login-box">
    <div class="login-card">
      <div class="login-icon">
        <span class="material-symbols-rounded">subscriptions</span>
      </div>
      <div class="login-hdr">
        <h1>Abonelik Takip</h1>
        <p>Hesabınıza giriş yapın</p>
      </div>

      {% if form.errors %}
      <div class="login-error">
        <span class="material-symbols-rounded">error</span>
        Kullanıcı adı veya şifre hatalı.
      </div>
      {% endif %}

      <form method="post" class="login-form" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_username">
            <span class="material-symbols-rounded">person</span> Kullanıcı Adı
          </label>
          <input type="text" name="username" id="id_username" class="form-input" placeholder="kullanıcı adınız" autofocus autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="id_password">
            <span class="material-symbols-rounded">lock</span> Şifre
          </label>
          <input type="password" name="password" id="id_password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary btn-full">
          <span class="material-symbols-rounded">login</span> Giriş Yap
        </button>
      </form>
    </div>
  </div>
</body>
</html>
