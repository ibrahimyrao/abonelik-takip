services:
  web:
    build: .
    container_name: abonelik-takip-app
    restart: always
    volumes:
      - .:/app
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-very-strong-random-key-in-production}
      - ALLOWED_HOSTS=yourdomain.com,your-local-ip
      - CSRF_TRUSTED_ORIGINS=https://yourdomain.com,http://your-local-ip:8084
      - SECURE_COOKIES=0
    ports:
      - "8084:8000"
