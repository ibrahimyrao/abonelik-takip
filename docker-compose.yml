services:
  web:
    build: .
    container_name: abonelik-takip-app
    restart: always
    volumes:
      - .:/app
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-very-strong-random-key-in-production}
      - ALLOWED_HOSTS=abonelik.lasmon.me,192.168.1.110
      - CSRF_TRUSTED_ORIGINS=https://abonelik.lasmon.me,http://192.168.1.110:8084
      - SECURE_COOKIES=0
    ports:
      - "8084:8000"
